bio:
  - "I have been at UC San Diego since January 2018. My group works across computer vision, deep learning, wireless communication, sensing, and networking, building technologies from theory to practice for robotics, autonomous systems, and everyday devices."
  - "Previously, I was a postdoctoral associate at MIT CSAIL working on data-center networking and wireless sensing. I received my PhD at Stanford University for work on full-duplex radios, a problem long considered near-impossible to realize in practice."
  - "Before Stanford, I received my bachelor's degree in Electrical Engineering from IIT Kanpur in 2010 and was awarded a gold medal for graduating at the top of the Electrical Engineering class."
industry:
  title: "Broader industry impact"
  text: "Our work on full-duplex radios translated into Kumu Networks, where I worked as Principal Scientist to commercialize the technology. The resulting systems completed field trials with major tier-1 wireless providers and helped show that full-duplex could move from research to real products."
