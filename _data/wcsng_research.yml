  - slug: "spectrum-sensing"
    title: "Spectrum Intelligence"
    url: "/research/#spectrum-sensing"
    external_url: "https://wcsng.ucsd.edu/spectrum_sensing.html"
    image: "/images/wcsng/spectrum-sensing.jpg"
    image_alt: "Spectrum sensing visualization from the WCSNG group"
    summary: "Sense wide swaths of spectrum in real time, compress what matters, and build the data pipelines needed for spectrum-aware wireless systems."
    themes:
      - "Low-cost wideband sensing architectures with strong time and frequency resolution."
      - "Backhaul- and compute-efficient processing for large spectrum sensor deployments."
      - "Synthetic and real RF data generation for modern spectrum information systems."
    people:
      - "Dinesh Bharadia"
      - "Raghav Subbaraman"
