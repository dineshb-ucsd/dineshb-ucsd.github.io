intro:
  title: "Research grounded in systems building, real deployment constraints, and new wireless capabilities."
  lede: "The WCSNG agenda connects communication, sensing, robotics, and secure networked systems. The common pattern is to identify a hard systems bottleneck, build the missing stack end to end, and make the resulting capability usable in practice."
areas:
  - slug: "wireless-sensing"
    title: "Wireless Sensing and Localization"
    url: "/research/#wireless-sensing"
    external_url: "https://wcsng.ucsd.edu/wireless-sensing.html"
    image: "/images/wcsng/wireless-sensing.jpg"
    image_alt: "Wireless sensing setup from the WCSNG group"
    summary: "Turn commodity WiFi, BLE, and UWB infrastructure into centimeter-scale sensing systems for indoor localization, robotics, SLAM, and secure spatial intelligence."
    themes:
      - "Centimeter-scale localization and tracking with WiFi, BLE, and UWB."
      - "WiFi sensing toolchains and SLAM pipelines for robots and warehouse systems."
      - "Security- and privacy-aware sensing systems that remain robust in real environments."
    people:
      - "Dinesh Bharadia"
      - "Roshan Ayyalasomayajula"
      - "Aditya Arun"
      - "Ish Kumar Jain"
      - "Shunsuke Saruwatari"
    links:
      - title: "WiROS toolbox"
        url: "/software/#wiros"
      - title: "ULoc localization"
        url: "/software/#uloc"
      - title: "DLoc and WILD dataset"
        url: "/software/#dloc"
  - slug: "towards-xg"
    title: "NextG Wireless Systems"
    url: "/research/#towards-xg"
    external_url: "https://wcsng.ucsd.edu/communication.html"
    image: "/images/wcsng/towards-xg.jpg"
    image_alt: "Next-generation wireless experiment from the WCSNG group"
    summary: "Build the next generation of wireless systems around reliable mmWave links, sustainable MIMO, and real-time AI control inside programmable RANs."
    themes:
      - "Sustainable dense 6G networks built around low-power MIMO and virtualization."
      - "Reliable mmWave systems that use multi-beam designs and cross-domain sensing."
      - "Sub-millisecond AI control and optimization for open and programmable RAN stacks."
    people:
      - "Dinesh Bharadia"
      - "Ish Kumar Jain"
      - "Agrim Gupta"
      - "Ushasi Ghosh"
      - "Rohith Reddy Vennam"
    links:
