      - title: "C-Shenron simulator"
        url: "/software/#c-shenron"
  - slug: "security-and-privacy"
    title: "Wireless Security and Privacy"
    url: "/research/#security-and-privacy"
    external_url: "https://wcsng.ucsd.edu/privacy.html"
    image: "/images/wcsng/security-and-privacy.png"
    image_alt: "Security and privacy experiment from the WCSNG group"
    summary: "Expose how wireless systems can be fingerprinted, jammed, spoofed, or tracked, then build defenses that preserve both reliability and privacy."
    themes:
      - "Attacks and defenses for BLE, WiFi, mmWave, and automotive radar systems."
      - "Detection of hidden or fingerprintable wireless devices from physical-layer signatures."
      - "Privacy-preserving localization and robust wireless operation under adversarial conditions."
    people:
