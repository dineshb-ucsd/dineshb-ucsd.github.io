  - slug: "reliable-autonomous-systems"
    title: "Autonomous Perception and Radar"
    url: "/research/#reliable-autonomous-systems"
    external_url: "https://wcsng.ucsd.edu/vehicular.html"
    image: "/images/wcsng/reliable-autonomous-systems.png"
    image_alt: "Autonomous systems research image from the WCSNG group"
    summary: "Fuse radar, cameras, simulation, and learning to make autonomous perception more robust under weather, occlusion, and other failure modes of vision-only systems."
    themes:
      - "Multi-modal data collection across radar, camera, LiDAR, GPS, IMUs, and simulation."
      - "Algorithms for robust perception, sensor fusion, and end-to-end autonomy."
      - "Applications spanning warehouse automation, outdoor driving, and infrastructure sensing."
    people:
