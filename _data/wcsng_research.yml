  - slug: "ubiquitous-iot"
    title: "Battery-Free IoT and Smart Surfaces"
    url: "/research/#ubiquitous-iot"
    external_url: "https://wcsng.ucsd.edu/ubiquitousIoT.html"
    image: "/images/wcsng/ubiquitous-iot.png"
    image_alt: "Battery-free backscatter hardware from the WCSNG group"
    summary: "Push backscatter and smart-surface design toward ultra-low-power connectivity, battery-free sensing, and wireless environments that can actively shape propagation."
    themes:
      - "Ultra-low-power communication using WiFi, BLE, and other commodity infrastructure."
      - "Smart surfaces that shape propagation and increase multiplexing in wireless links."
      - "Battery-free sensing systems that recover force and other physical interactions from backscatter."
    people:
      - "Dinesh Bharadia"
      - "Manideep Dunna"
      - "Agrim Gupta"
      - "Nagarjun Bhat"
      - "Ishan Bansal"
    links:
