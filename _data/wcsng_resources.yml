    github: "https://github.com/ucsdsysnet/sparsdr"
    paper: "http://people.csail.mit.edu/moein/papers/sparsdr-mobisys19.pdf"
  - slug: "rfsynth"
    title: "RFSynth"
    year: 2024
    area: "Spectrum Sensing"
    summary: "A scalable RF data generation and testing platform for spectrum information systems and RF ML evaluation."
    github: "https://github.com/ucsdwcsng/rfsynth"
    paper: "https://wcsng.ucsd.edu/files/rfsynth.pdf"
