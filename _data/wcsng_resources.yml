software:
  - slug: "wiros"
    title: "WiROS"
    year: 2023
    area: "Wireless Sensing"
    summary: "A WiFi sensing toolbox for robotics and ROS, including calibration utilities and measurement pipelines for CSI and bearing extraction."
    github: "https://github.com/ucsdwcsng/WiROS"
    paper: "https://wcsng.ucsd.edu/files/wiros-demo.pdf"
  - slug: "uloc"
    title: "ULoc"
    year: 2021
    area: "Wireless Sensing"
    summary: "A centimeter-accurate, low-latency, and power-efficient UWB localization stack built around a simple transmit-only tag and multi-antenna anchors."
    github: "https://github.com/ucsdwcsng/ULoc-public"
    paper: "https://wcsng.ucsd.edu/files/uloc.pdf"
  - slug: "dpa"
    title: "mmFlexible / DPA"
    year: 2023
    area: "Towards xG"
    summary: "A delay-phased array architecture that enables directional frequency multiplexing for multi-user mmWave systems."
    github: "https://github.com/ucsdwcsng/dpa"
    paper: "https://wcsng.ucsd.edu/files/mmflexible.pdf"
  - slug: "mmreliable"
    title: "mmReliable"
    year: 2021
    area: "Towards xG"
    summary: "A multi-beam mmWave system that uses constructive beam patterns and tracking to deliver reliable high-throughput links."
    github: "https://github.com/ucsdwcsng/mmReliable"
    paper: "https://wcsng.ucsd.edu/files/mmreliable.pdf"
  - slug: "edgeric"
    title: "EdgeRIC"
    year: 2024
    area: "Towards xG"
    summary: "A real-time RAN intelligent controller that runs AI-driven optimization at the radio timescale for disaggregated cellular systems."
    github: "https://github.com/ucsdwcsng/EdgeRIC-A-real-time-RIC.git"
    paper: "https://www.usenix.org/system/files/nsdi24-ko.pdf"
  - slug: "sensync"
    title: "SenSync"
    year: 2025
    area: "Ubiquitous IoT"
    summary: "A real-time RFID sensing system that resolves temporal misalignment and phase ambiguity for practical passive sensing deployments."
    github: "https://github.com/ucsdwcsng/SenSync"
    paper: "https://wcsng.ucsd.edu/files/sensync.pdf"
  - slug: "beamarmor"
    title: "BeamArmor"
    year: 2024
    area: "Security and Privacy"
    summary: "A seamless anti-jamming system for 5G networks that combines MIMO null-steering with real-time control."
    github: "https://github.com/ucsdwcsng/beamarmor"
    paper: "https://wcsng.ucsd.edu/files/beamarmor.pdf"
  - slug: "sweepsense"
    title: "SweepSense"
    year: 2019
    area: "Spectrum Sensing"
    summary: "A low-cost radio architecture that senses wide spectrum with high temporal resolution by rapidly sweeping the center frequency."
