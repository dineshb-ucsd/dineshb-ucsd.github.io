<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  (function () {
    var nav = document.getElementById("site-nav");
    if (nav) {
      var button = nav.querySelector("button");
      var hiddenLinks = document.getElementById("site-nav-hidden-links");

      if (button && hiddenLinks) {
        function syncNavA11yState() {
          var expanded = !hiddenLinks.classList.contains("hidden");
          button.setAttribute("aria-expanded", expanded ? "true" : "false");
          hiddenLinks.setAttribute("aria-hidden", expanded ? "false" : "true");
        }

        syncNavA11yState();

        button.addEventListener("click", function () {
          window.requestAnimationFrame(syncNavA11yState);
        });

        window.addEventListener("resize", syncNavA11yState);
      }
    }

    var profileButton = document.querySelector(".author__urls-wrapper button");
    var profileLinks = document.getElementById("author-profile-links");
    if (!profileButton || !profileLinks) return;

    function syncProfileA11yState() {
      var buttonVisible = window.getComputedStyle(profileButton).display !== "none";
      var linksVisible = !buttonVisible || window.getComputedStyle(profileLinks).display !== "none";
      profileButton.setAttribute("aria-expanded", linksVisible ? "true" : "false");
      profileLinks.setAttribute("aria-hidden", linksVisible ? "false" : "true");
    }

    syncProfileA11yState();
    profileButton.addEventListener("click", function () {
      window.requestAnimationFrame(syncProfileA11yState);
    });
    window.addEventListener("resize", syncProfileA11yState);
  })();
</script>
